name: release

# Publish to PyPI with Trusted Publishing (OIDC). No API token exists anywhere:
# GitHub proves the workflow's identity to PyPI directly, so there is no secret
# to store on a laptop, paste into a chat, leak in a log, or rotate afterwards.
#
# ONE-TIME SETUP, on PyPI (nobody can do this for you, it is an account action):
#   https://pypi.org/manage/project/barber-llm/settings/publishing/
#   Add a trusted publisher:
#     Owner:              NadirRouter
#     Repository:         barber
#     Workflow filename:  release.yml
#     Environment:        (leave blank, this workflow declares none)
#
# Then a tag push publishes. v0.1.3 is already tagged, so use the manual
# trigger for it: Actions -> release -> Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for Trusted Publishing; nothing else is
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      # The wheel must never carry contrib/: that hook is experimental and is
      # not covered by the published retention benchmark, so it stays reachable
      # from the source tree and out of every installed environment. Failing the
      # release is the right outcome if that ever stops being true, because it
      # cannot be undone once a version is on PyPI.
      - name: Refuse to ship contrib in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if "contrib" in n]
          if bad:
              sys.exit(f"contrib leaked into the wheel: {bad}")
          print(f"ok: {wheel} has {len(names)} entries, no contrib")
          PY

      # The version is burned on upload and can never be reused, so check it is
      # not already taken before trying rather than reading it off a 400.
      - name: Refuse to republish an existing version
        run: |
          python - <<'PY'
          import glob, json, os, re, sys, urllib.request
          sdist = glob.glob("dist/*.tar.gz")[0]
          version = re.search(r"-([0-9][^-]*)\.tar\.gz$", os.path.basename(sdist)).group(1)
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/barber-llm/json", timeout=20) as r:
                  released = set(json.load(r)["releases"])
          except Exception as e:
              print(f"could not reach PyPI ({e}); letting the upload decide")
              sys.exit(0)
          if version in released:
              sys.exit(f"barber-llm {version} is already on PyPI. Bump the version.")
          print(f"ok: {version} is not published yet")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
