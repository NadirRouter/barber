name: release

# Publish to PyPI with Trusted Publishing (OIDC). No API token exists anywhere:
# GitHub proves the workflow's identity to PyPI directly, so there is no secret
# to store on a laptop, paste into a chat, leak in a log, or rotate afterwards.
#
# ONE-TIME SETUP, on PyPI (nobody can do this for you, it is an account action):
#   https://pypi.org/manage/project/barber-llm/settings/publishing/
#   Add a trusted publisher:
#     Owner:              NadirRouter
#     Repository:         barber
#     Workflow filename:  release.yml
#     Environment:        (leave blank, this workflow declares none)
#
# Then a tag push publishes. A version that is already tagged can be released
# with the manual trigger: Actions -> release -> Run workflow.
#
# STEP ORDER IS DELIBERATE: cheapest and most likely to fail comes first, so a
# misconfigured publisher costs one HTTP round trip instead of a full build.
#   1. auth      - proves PyPI accepts this workflow's identity
#   2. version   - proves the version is not already burned
#   3. build     - only then is it worth building anything
#   4. contents  - proves the wheel is what we think it is
#   5. publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for Trusted Publishing; nothing else is
    steps:
      # No checkout needed: this asks GitHub for an identity token and asks PyPI
      # whether it accepts it. Nothing about the repo contents matters yet.
      - name: Prove PyPI accepts this workflow's identity
        run: |
          set -euo pipefail
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                   "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$oidc"
          code=$(curl -sS -o /tmp/mint.json -w '%{http_code}' \
                   -X POST https://pypi.org/_/oidc/mint-token \
                   -d "{\"token\": \"$oidc\"}")
          if [ "$code" != "200" ]; then
            echo "PyPI refused this workflow's identity (HTTP $code)."
            echo "--- PyPI said ---"
            cat /tmp/mint.json; echo
            echo "--- the claims PyPI matched against ---"
            # The JWT payload is not a secret (the signature is what authenticates
            # it) and these are exactly the fields a trusted publisher matches on,
            # so print them: "no corresponding publisher" is unactionable without
            # knowing WHICH field disagrees.
            python3 - "$oidc" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("repository", "repository_owner", "workflow_ref",
                    "job_workflow_ref", "ref", "environment", "sub"):
              print(f"  {k:20} = {claims.get(k, '(absent)')}")
          PY
            echo "---------------------------------------"
            echo "On https://pypi.org/manage/project/barber-llm/settings/publishing/ the"
            echo "publisher must match ALL of: owner, repository, workflow FILENAME"
            echo "(release.yml - not a path, not the workflow's name:), and environment."
            echo "environment above being absent means the PyPI field must be EMPTY;"
            echo "an environment name set there will never match this workflow."
            echo "A 'pending publisher' does not apply to a project that already exists -"
            echo "it must be added under the barber-llm project's own settings."
            rm -f /tmp/mint.json
            exit 1
          fi
          # The response body is a real, short-lived upload token. It is not
          # needed here (the publish step mints its own) and must not outlive
          # this step or reach a log.
          rm -f /tmp/mint.json
          echo "ok: PyPI accepted this workflow's identity"

      - uses: actions/checkout@v4

      # Reads the version from pyproject rather than from a built artifact, so
      # this runs before the build. A PyPI upload cannot be undone -- yanking
      # does not free the number -- so a collision must fail on a readable
      # message, not a 400 from the upload.
      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import re
          src = open("pyproject.toml").read()
          print(re.search(r'(?m)^version\s*=\s*"([^"]+)"', src).group(1))
          PY
          )
          echo "this build is version $version"
          python3 - "$version" <<'PY'
          import json, sys, urllib.request
          version = sys.argv[1]
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/barber-llm/json", timeout=20) as r:
                  released = set(json.load(r)["releases"])
          except Exception as e:
              print(f"could not reach PyPI ({e}); letting the upload decide")
              sys.exit(0)
          if version in released:
              sys.exit(f"barber-llm {version} is already on PyPI. Bump the version.")
          print(f"ok: {version} is not published yet")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      # The wheel must never carry contrib/: that hook is experimental and is
      # not covered by the published retention benchmark, so it stays reachable
      # from the source tree and out of every installed environment. This
      # invariant rests on pyproject's packages = ["barber"], one edit away from
      # silently not holding.
      - name: Refuse to ship contrib in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if "contrib" in n]
          if bad:
              sys.exit(f"contrib leaked into the wheel: {bad}")
          print(f"ok: {wheel} has {len(names)} entries, no contrib")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
