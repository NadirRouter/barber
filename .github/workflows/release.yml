name: release

# Publish to PyPI with Trusted Publishing (OIDC). No API token exists anywhere:
# GitHub proves the workflow's identity to PyPI directly, so there is no secret
# to store on a laptop, paste into a chat, leak in a log, or rotate afterwards.
#
# ONE-TIME SETUP, on PyPI (nobody can do this for you, it is an account action):
#   https://pypi.org/manage/project/barber-llm/settings/publishing/
#   Add a trusted publisher to the EXISTING project (a "pending publisher" is
#   for projects that do not exist yet and will never match):
#     Owner:              NadirRouter
#     Repository:         barber
#     Workflow filename:  release.yml      <- the filename, not a path, not `name:`
#     Environment:        LEAVE BLANK      <- this workflow declares none, so any
#                                             value here can never match
#
# STEP ORDER IS DELIBERATE: answer "is there anything to do?" before "can we do
# it?", and both before spending a build.
#   0. test     - the tag's own tree is green (a JOB, see below)
#   1. version  - already on PyPI? then there is nothing to publish; stop, green
#   2. auth     - prove PyPI accepts this workflow's identity
#   3. build
#   4. contents - the wheel is what we think it is
#   5. publish
#
# WHY THE TESTS RUN HERE AND NOT VIA ci.yml: `needs:` only reaches jobs in the
# SAME workflow, and ci.yml triggers on branch pushes and PRs, never on a tag.
# There is no cross-workflow gate to depend on, so before this job existed a tag
# pushed onto a red main published to PyPI regardless. This is the same suite as
# ci.yml, run against the tagged tree — the only tree that is about to ship.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # First, because it is the cheapest gate and the one whose failure is
      # unrecoverable: a wheel that reports the wrong __version__ cannot be
      # replaced, only superseded (0.4.1 exists for exactly that reason). This
      # runs before anything is installed on purpose — it reads the tagged
      # tree's source text, so it is unaffected by what pip put in site-packages.
      - name: Versions agree
        run: python tests/test_versions.py
      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
          pytest tests/ -q
      # Not a version gate: this stamps barber.__version__ into the fixture it
      # compares against, so a stale __version__ stays green here. See the step
      # above.
      - name: Golden fixtures are fresh
        run: python tests/gen_golden.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS parity and unit tests
        run: node --test
        working-directory: js

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for Trusted Publishing; nothing else is
    steps:
      - uses: actions/checkout@v4

      # A version that is already on PyPI is not an error, it is a no-op: the
      # upload cannot be repeated (yanking does not free the number), so the only
      # correct action is to stop. Re-running a release that someone already
      # published by hand should report "nothing to do", not fail — a red run
      # that means "everything is fine" trains you to ignore red runs.
      - name: Is there anything to publish?
        id: check
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import re
          print(re.search(r'(?m)^version\s*=\s*"([^"]+)"', open("pyproject.toml").read()).group(1))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$(python3 - "$version" <<'PY'
          import json, sys, urllib.request
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/barber-llm/json", timeout=20) as r:
                  releases = set(json.load(r)["releases"])
          except Exception as e:
              print("no", f"(could not reach PyPI: {e})")
              raise SystemExit
          print("yes" if sys.argv[1] in releases else "no")
          PY
          )
          if [ "${published%% *}" = "yes" ]; then
            echo "todo=no" >> "$GITHUB_OUTPUT"
            echo "barber-llm $version is already on PyPI. Nothing to publish."
            echo "Bump the version to release again."
          else
            echo "todo=yes" >> "$GITHUB_OUTPUT"
            echo "barber-llm $version is not on PyPI yet; proceeding."
          fi

      # Asks GitHub for an identity token and asks PyPI whether it accepts it —
      # what the publish action does internally, run before anything expensive so
      # a misconfigured publisher costs one round trip instead of a whole build.
      - name: Prove PyPI accepts this workflow's identity
        if: steps.check.outputs.todo == 'yes'
        run: |
          set -euo pipefail
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                   "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$oidc"
          code=$(curl -sS -o /tmp/mint.json -w '%{http_code}' \
                   -X POST https://pypi.org/_/oidc/mint-token \
                   -d "{\"token\": \"$oidc\"}")
          if [ "$code" != "200" ]; then
            echo "PyPI refused this workflow's identity (HTTP $code)."
            echo "--- PyPI said ---"
            cat /tmp/mint.json; echo
            echo "--- the claims PyPI matched against ---"
            # The JWT payload is not a secret (the signature is what authenticates
            # it) and these are exactly the fields a trusted publisher matches on,
            # so print them: "no corresponding publisher" is unactionable without
            # knowing WHICH field disagrees.
            python3 - "$oidc" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("repository", "repository_owner", "workflow_ref",
                    "job_workflow_ref", "ref", "environment", "sub"):
              print(f"  {k:20} = {claims.get(k, '(absent)')}")
          PY
            echo "---------------------------------------"
            echo "Compare those against the entry on"
            echo "  https://pypi.org/manage/project/barber-llm/settings/publishing/"
            echo "environment being absent above means the PyPI field must be EMPTY;"
            echo "a name set there can never match this workflow. The workflow field"
            echo "is the FILENAME release.yml, not a path and not the workflow's name:."
            echo "A pending publisher does not apply to a project that already exists."
            rm -f /tmp/mint.json
            exit 1
          fi
          # The response body is a real, short-lived upload token. It is not
          # needed here (the publish step mints its own) and must not outlive
          # this step or reach a log.
          rm -f /tmp/mint.json
          echo "ok: PyPI accepted this workflow's identity"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.todo == 'yes'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.check.outputs.todo == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      # The wheel must never carry contrib/: that hook is experimental and is
      # not covered by the published retention benchmark, so it stays reachable
      # from the source tree and out of every installed environment. This
      # invariant rests on pyproject's packages = ["barber"], one edit away from
      # silently not holding, and a PyPI upload cannot be undone.
      - name: Refuse to ship contrib in the wheel
        if: steps.check.outputs.todo == 'yes'
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if "contrib" in n]
          if bad:
              sys.exit(f"contrib leaked into the wheel: {bad}")
          print(f"ok: {wheel} has {len(names)} entries, no contrib")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.check.outputs.todo == 'yes'
